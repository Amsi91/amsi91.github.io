<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Site Secret d'Amara 🔒</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 60%, #2a0818 0%, #12020a 65%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      cursor: default;
    }

    /* Particules de fond */
    .particle {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      animation: floatUp var(--d) ease-in-out var(--delay) infinite;
      font-size: var(--size);
      z-index: 0;
    }
    @keyframes floatUp {
      0%   { opacity:0; transform:translateY(0) rotate(0deg) scale(.6); }
      15%  { opacity:.15; }
      85%  { opacity:.08; }
      100% { opacity:0; transform:translateY(-140px) rotate(30deg) scale(1.2); }
    }

    /* Card centrale */
    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,100,160,0.18);
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(255,79,139,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(4px);
    }

    .lock {
      font-size: 3.2rem;
      filter: drop-shadow(0 0 18px rgba(255,100,160,.7));
      animation: lockbeat 2s ease-in-out infinite;
    }
    @keyframes lockbeat {
      0%,100% { transform:scale(1); }
      50%      { transform:scale(1.1); }
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1rem, 3.5vw, 1.7rem);
      color: #fff;
      text-align: center;
      line-height: 1.35;
      text-shadow: 0 0 35px rgba(255,100,160,.55), 0 2px 6px rgba(0,0,0,.9);
    }

    .tag {
      font-size: .68rem;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: rgba(255,150,190,.5);
    }

    .divider {
      display: flex; align-items: center; gap: .8rem;
      color: rgba(255,150,190,.3); font-size: .9rem; width: 100%;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px;
      background: linear-gradient(to right, transparent, rgba(255,100,160,.3));
    }
    .divider::before { transform: scaleX(-1); }

    input[type="password"] {
      width: 100%;
      padding: .9rem 1.4rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,100,160,.3);
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: #fff;
      text-align: center;
      letter-spacing: .15em;
      outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    input::placeholder { color: rgba(255,180,200,.3); letter-spacing:.2em; }
    input:focus {
      border-color: rgba(255,100,160,.7);
      box-shadow: 0 0 22px rgba(255,80,140,.2);
    }
    input.shake {
      border-color: rgba(255,60,60,.7);
      animation: shake .4s ease-out;
    }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%    { transform:translateX(-8px); }
      40%    { transform:translateX(8px); }
      60%    { transform:translateX(-5px); }
      80%    { transform:translateX(5px); }
    }

    button {
      width: 100%;
      padding: .9rem;
      background: linear-gradient(135deg, #ff4f8b, #c0004a);
      border: none; border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem; font-weight: 500;
      letter-spacing: .15em; text-transform: uppercase;
      color: #fff; cursor: pointer;
      box-shadow: 0 8px 28px rgba(255,79,139,.45);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover  { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(255,79,139,.6); }
    button:active { transform: scale(.97); }

    .error {
      font-size: .74rem;
      color: rgba(255,100,120,.95);
      text-align: center;
      min-height: 1.2em;
    }

    .hint {
      font-size: .64rem;
      color: rgba(255,150,190,.28);
      letter-spacing: .12em;
      text-align: center;
    }

    /* Flash de transition */
    #flash {
      position: fixed; inset:0; z-index:999;
      background:#fff; opacity:0; pointer-events:none;
      transition: opacity .08s;
    }
  </style>
</head>
<body>

  <!-- Particules décoratives -->
  <span class="particle" style="left:8%;top:75%;--d:6s;--delay:0s;--size:1.8rem">💕</span>
  <span class="particle" style="left:82%;top:78%;--d:8s;--delay:1.2s;--size:1.4rem">🌹</span>
  <span class="particle" style="left:20%;top:80%;--d:7s;--delay:2s;--size:1.9rem">♥</span>
  <span class="particle" style="left:68%;top:70%;--d:5s;--delay:.6s;--size:1.6rem">💖</span>
  <span class="particle" style="left:45%;top:85%;--d:9s;--delay:3.2s;--size:1.3rem">🌸</span>
  <span class="particle" style="left:90%;top:38%;--d:6.5s;--delay:1.8s;--size:1.5rem">💗</span>
  <span class="particle" style="left:5%;top:40%;--d:7.5s;--delay:0.9s;--size:1.2rem">✨</span>
  <span class="particle" style="left:55%;top:72%;--d:5.5s;--delay:2.5s;--size:1.7rem">💝</span>

  <div class="card">
    <div class="lock">🔒</div>
    <h1>Site Secret<br>Top Défense d'Amara</h1>
    <div class="divider">♥</div>
    <p class="tag">Accès restreint · Sésame ouvre-toi</p>
    <input type="password" id="pw" placeholder="Mot de passe..." autocomplete="off" autofocus/>
    <button onclick="check()">Entrer ♥</button>
    <p class="error" id="err"></p>
    <p class="hint">Indice : c'est un dessert que je te ramène du CA, moelleux, et plein de chocolat 🍪</p>
  </div>

  <div id="flash"></div>

  <script>
    var CORRECT  = "Cookie";
    var attempts = 0;
    var msgs = [
      "Nan t'as pas trouvé ? Même pas un peu... Réessaye 😏",
      "Toujours pas... T'es sûre de connaître Amara ? 🤔",
      "Troisième essai raté... L'indice est là pour aider ! 🐾",
      "C'est mignon, doux et ça ronronne... 🐱",
      "C'est Cookie ! Bon, dernière chance... 😂"
    ];

    function check() {
      var pw  = document.getElementById('pw');
      var err = document.getElementById('err');
      if (pw.value.trim() === CORRECT) {
        // Flash blanc → redirection vers site1
        var fl = document.getElementById('flash');
        fl.style.opacity = '1';
        setTimeout(function(){ window.location.href = 'site1.html'; }, 300);
      } else {
        attempts++;
        err.textContent = msgs[Math.min(attempts-1, msgs.length-1)];
        pw.classList.remove('shake');
        void pw.offsetWidth;
        pw.classList.add('shake');
        pw.value = ''; pw.focus();
        if (attempts >= 5) {
          err.textContent = '5 essais ratés... Redirection 😅';
          setTimeout(function(){ window.location.href = 'https://amsi91.github.io'; }, 1500);
        }
      }
    }

    document.getElementById('pw').addEventListener('keydown', function(e){
      if (e.key === 'Enter') check();
    });
  </script>
</body>
</html>
